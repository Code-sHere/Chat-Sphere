<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Group Chat</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="h-screen flex">

    <!-- LEFT PANEL -->

    <div class="w-72 border-r flex flex-col">

        <div class="p-4 font-bold border-b">
            Group Chat
        </div>

        <!-- CREATE ROOM -->

        <div class="p-4 border-b">

            <button
                onclick="createRoom()"
                class="w-full bg-blue-600 text-white px-4 py-2 rounded mb-3">

                Create Room

            </button>

            <!-- JOIN ROOM -->

            <div class="flex gap-2">

                <input
                    id="roomIdInput"
                    placeholder="Enter Room ID"
                    class="flex-1 border px-3 py-2 rounded"
                >

                <button
                    onclick="joinRoom()"
                    class="bg-green-600 text-white px-4 py-2 rounded">

                    Join

                </button>

            </div>

        </div>

        <!-- ROOM INFO -->

        <div class="p-4 text-sm text-gray-600">

            <div id="roomIdDisplay">
                No room connected
            </div>

        </div>

    </div>


    <!-- CHAT AREA -->

    <div class="flex flex-col flex-1">

        <!-- HEADER -->

        <div class="p-4 border-b flex justify-between items-center">

            <div id="chatHeader" class="font-semibold">

                Group Chat

            </div>

            <button
                id="leaveBtn"
                onclick="leaveRoom()"
                class="bg-red-500 text-white px-4 py-2 rounded-full">

                Leave Room

            </button>

        </div>


        <!-- MESSAGES -->

        <div
            id="messageContainer"
            class="flex-1 overflow-y-auto p-4 space-y-2 bg-gray-100">

        </div>


        <!-- INPUT -->

        <div class="flex gap-2 p-3 border-t">

            <input
                id="messageInput"
                type="text"
                placeholder="Type message"
                class="flex-1 border px-4 py-2 rounded-full"
            >

            <button
                onclick="sendMessage()"
                class="bg-blue-600 text-white px-4 py-2 rounded-full">

                Send

            </button>

        </div>

    </div>

    <script th:src="@{/js/GroupchatOperations.js}"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Private Chat</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script th:src="@{/css/style1.css}"></script>
</head>

<body class="h-screen flex">

    <!-- USER LIST -->
    <div class="w-72 border-r flex flex-col">

        <div class="p-4 font-bold border-b">
            Users
        </div>

        <!-- SEARCH -->
        <input
            id="searchUser"
            placeholder="Search user..."
            class="m-2 border px-3 py-2 rounded"
            onkeyup="searchUser()"
        >

        <!-- USER LIST -->
        <div
            id="userList"
            class="flex-1 overflow-y-auto">
        </div>

    </div>

    <!-- CHAT AREA -->
    <div class="flex flex-col flex-1">

        <!-- HEADER -->
        <div
            id="chatHeader"
            class="p-4 border-b font-semibold">
            Select a user to start chatting
        </div>

        <!-- MESSAGES -->
        <div
            id="messageContainer"
            class="flex-1 overflow-y-auto p-4 space-y-2 bg-gray-100">
        </div>

        <!-- INPUT -->
        <div class="flex gap-2 p-3 border-t">

            <input
                id="messageInput"
                type="text"
                placeholder="Type message"
                class="flex-1 border px-4 py-2 rounded-full"
            >

            <button
                onclick="sendMessage()"
                class="bg-blue-600 text-white px-4 py-2 rounded-full">
                Send
            </button>

        </div>

    </div>

    <!-- LOAD JS -->
    <script th:src="@{/js/Operation.js}"></script>

</body>
</html>

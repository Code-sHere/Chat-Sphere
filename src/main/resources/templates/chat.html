<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Private Chat</title>

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Emoji Picker -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/emoji-picker-element@1/index.css">

    <script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@1/index.js">
    </script>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- YOUR COLOR PALETTE -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#B51A2B",
                        secondary: "#FFA586",
                        dark: "#384358",
                        deep: "#161E2F",
                        panel: "#242F49"
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" th:href="@{/css/style1.css}">
</head>

<body class="h-screen p-6 bg-gradient-to-b from-primary to-deep text-white">

    <div class="h-full flex gap-6">

        <!-- USER LIST -->

        <div class="w-72 flex flex-col rounded-2xl user-panel glass overflow-hidden">

            <!-- LOGO -->

            <div class="p-3 font-bold text-lg glass flex items-center gap-2 text-white">

                <img th:src="@{/images/Vibrant Chat-Sphere logo design.png}" class="w-14 h-12">

                Chat-Sphere

            </div>

            <!-- SEARCH -->

            <input id="searchUser" placeholder="Search anyone..."
                class="m-3 px-3 py-2 rounded-xl outline-none bg-panel text-white" onkeyup="searchUser()">

            <!-- USER LIST -->

            <div id="userList" class="flex-1 overflow-y-auto border-t border-white/10">

            </div>

            <!-- GROUP BUTTON -->

            <div class="p-4 border-t flex gap-2">

                <button class="rounded-full w-full cursor-pointer bg-primary text-white p-2 shadow-lg"
                    onclick="Groups()">

                    Groups

                </button>

            </div>

        </div>

        <!-- CHAT AREA -->

        <div class="flex flex-col flex-1 rounded-2xl glass">

            <!-- HEADER -->

            <div id="chatHeader" class="p-4 font-semibold glass rounded-t-2xl text-white">

                Select a user to start chatting

            </div>

            <!-- MESSAGES -->

            <div id="messageContainer" class="flex-1 overflow-y-auto p-4 space-y-2">

            </div>

            <!-- INPUT -->

            <div class="flex gap-2 p-3 border-t border-white/10 glass">

                <!-- ATTACH -->

                <label for="fileInput"
                    class="bg-secondary text-black px-4 py-2 rounded-full cursor-pointer flex items-center justify-center">

                    <i class="fa-solid fa-paperclip"></i>

                </label>
                
                <input type="file" id="fileInput" class="hidden" onchange="uploadAttachment()">

                <!-- MESSAGE INPUT -->

                <input id="messageInput" type="text" placeholder="Type message"
                    class="flex-1 border px-4 py-2 rounded-full outline-none bg-panel text-white border-none">

                <!-- EMOJI -->

                <div class="relative">

                    <button id="emojiBtn" class="bg-secondary text-black px-4 py-2 rounded-full shadow-md">

                        <i class="fa-regular fa-face-smile"></i>

                    </button>

                    <div id="emojiPickerContainer" class="hidden absolute bottom-14 right-0 z-50 shadow-lg">

                        <emoji-picker></emoji-picker>

                    </div>

                </div>

                <!-- SEND -->

                <button onclick="sendMessage()" class="bg-primary text-white px-4 py-2 rounded-full shadow-lg">

                    <i class="fa-solid fa-paper-plane"></i>

                </button>

            </div>

        </div>

    </div>

    <script th:src="@{/js/Operation.js}"></script>

</body>

</html>

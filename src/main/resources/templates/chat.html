<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Private Chat</title>

    <!-- Icons -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Emoji Picker -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/emoji-picker-element@1/index.css">

    <script type="module"
        src="https://cdn.jsdelivr.net/npm/emoji-picker-element@1/index.js">
    </script>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- YOUR COLOR PALETTE -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#CD1C18",
                        secondary: "#FFA896",
                        dark: "#9B1313",
                        deep: "#38000A",
                        panel: "#1f1f1f"
                    }
                }
            }
        }
    </script>

<link rel="stylesheet" th:href="@{/css/style1.css}">
</head>

<body class="h-screen p-6">

<div class="h-full flex gap-6">

    <!-- USER LIST -->

    <div class="w-72 flex flex-col rounded-2xl user-panel overflow-hidden">

        <!-- LOGO -->

        <div class="p-4 font-bold text-lg glass flex items-center gap-2">

            <img th:src="@{/images/Vibrant Chat-Sphere logo design.png}"
                 class="w-8 h-8">

            Chat-Sphere

        </div>

        <!-- SEARCH -->

        <input
                id="searchUser"
                placeholder="Search anyone..."
                class="m-3 px-3 py-2 rounded-lg"
                onkeyup="searchUser()">

        <!-- USER LIST -->

        <div id="userList"
             class="flex-1 overflow-y-auto border-t">

        </div>

        <!-- GROUP BUTTON -->

        <div class="p-4 border-t flex gap-2">

            <button
                    class="rounded-full w-full cursor-pointer bg-primary text-white p-2"
                    onclick="Groups()">

                Groups

            </button>

        </div>

    </div>

    <!-- CHAT AREA -->

    <div class="flex flex-col flex-1 rounded-2xl bg-white shadow-lg">

        <!-- HEADER -->

        <div id="chatHeader"
             class="p-4 font-semibold glass rounded-t-2xl">

            Select a user to start chatting

        </div>

        <!-- MESSAGES -->

        <div id="messageContainer"
             class="flex-1 overflow-y-auto p-4 space-y-2">

        </div>

        <!-- INPUT -->

        <div class="flex gap-2 p-3 border-t">

            <!-- ATTACH -->

            <button
                    class="bg-secondary text-black px-4 py-2 rounded-full">

                <i class="fa-solid fa-paperclip"></i>

            </button>

            <!-- MESSAGE INPUT -->

            <input
                    id="messageInput"
                    type="text"
                    placeholder="Type message"
                    class="flex-1 border px-4 py-2 rounded-full outline-none">

            <!-- EMOJI -->

            <div class="relative">

                <button
                        id="emojiBtn"
                        class="bg-secondary text-black px-4 py-2 rounded-full">

                    <i class="fa-regular fa-face-smile"></i>

                </button>

                <div
                        id="emojiPickerContainer"
                        class="hidden absolute bottom-14 right-0 z-50 shadow-lg">

                    <emoji-picker></emoji-picker>

                </div>

            </div>

            <!-- SEND -->

            <button
                    onclick="sendMessage()"
                    class="bg-primary text-white px-4 py-2 rounded-full">

                <i class="fa-solid fa-paper-plane"></i>

            </button>

        </div>

    </div>

</div>

<!-- ENTER KEY SUPPORT -->

<script>

const messageInput =
    document.getElementById("messageInput");

messageInput.addEventListener(
    "keypress",
    function (e) {

        if (e.key === "Enter") {

            sendMessage();

        }

    }
);

</script>

<!-- LOAD YOUR JS -->

<script th:src="@{/js/Operation.js}"></script>

</body>

</html>

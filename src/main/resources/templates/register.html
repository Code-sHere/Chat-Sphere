<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sliding Login & Registration</title>
<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gradient-to-br from-blue-100 via-white to-green-100 flex items-center justify-center">

<div class="min-h-screen bg-gray-100 flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
  <div class="relative w-full max-w-4xl bg-white rounded-2xl shadow-2xl overflow-hidden min-h-[400px] flex">
    
    <div id="register-side" class="w-1/2 p-10 transition-all duration-500 transform translate-x-0 opacity-100">
      <h2 class="text-3xl font-bold text-gray-800 mb-6">Create Account</h2>
      <form action="/register" method="POST" enctype="multipart/form-data" class="space-y-4">
        <input type="text" name="username" placeholder="Full Name" required 
               class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-gray-50">
        
        <input type="email" name="email" placeholder="Email" required 
               class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-gray-50">
        
        <input type="password" name="password" placeholder="Password" required 
               class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-gray-50">

        <textarea name="about" placeholder="Tell us about yourself..." rows="3"
                  class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-gray-50 resize-none"></textarea>
        
        <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition">
          Sign Up
        </button>
      </form>
    </div>

    <div id="login-side" class="w-1/2 p-10 flex flex-col justify-center transition-all duration-500 transform translate-x-0">
      <h2 class="text-3xl font-bold text-gray-800 mb-6 text-center">Welcome Back</h2>
      <form action="/auth/login" method="POST" class="space-y-6">
        <input type="email" name="email" placeholder="Email" required 
               class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none bg-gray-50">
        
        <input type="password" name="password" placeholder="Password" required 
               class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none bg-gray-50">
        
        <div class="text-right">
          <a href="#" class="text-sm text-indigo-600 hover:underline">Forgot password?</a>
        </div>

        <button type="submit" class="w-full bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 transition">
          Sign In
        </button>
      </form>
    </div>

    <div id="overlay" class="absolute top-0 left-1/2 w-1/2 h-full bg-gradient-to-br from-blue-600 to-indigo-700 transition-all duration-500 ease-in-out transform translate-x-0 z-10 flex flex-col items-center justify-center text-white p-10 text-center">
      <div id="overlay-login-content">
        <h2 class="text-3xl font-bold mb-4">Hello, Friend!</h2>
        <p class="mb-8">Enter your personal details and start your journey with us</p>
        <button onclick="toggleForm()" class="border-2 border-white px-8 py-2 rounded-full font-semibold hover:bg-white hover:text-blue-600 transition">
          Register Instead
        </button>
      </div>
      <div id="overlay-reg-content" class="hidden">
        <h2 class="text-3xl font-bold mb-4">Welcome Back!</h2>
        <p class="mb-8">Keep connected with us by logging in with your info</p>
        <button onclick="toggleForm()" class="border-2 border-white px-8 py-2 rounded-full font-semibold hover:bg-white hover:text-indigo-600 transition">
          Login Instead
        </button>
      </div>
    </div>

  </div>
</div>

<script>
  let isLogin = true;
  function toggleForm() {
    const overlay = document.getElementById('overlay');
    const loginContent = document.getElementById('overlay-login-content');
    const regContent = document.getElementById('overlay-reg-content');
    
    if (isLogin) {
      // Switch to Register view
      overlay.style.transform = 'translateX(-100%)';
      overlay.classList.replace('from-blue-600', 'from-indigo-600');
      loginContent.classList.add('hidden');
      regContent.classList.remove('hidden');
    } else {
      // Switch to Login view
      overlay.style.transform = 'translateX(0%)';
      overlay.classList.replace('from-indigo-600', 'from-blue-600');
      regContent.classList.add('hidden');
      loginContent.classList.remove('hidden');
    }
    isLogin = !isLogin;
  }
</script>

</body>
</html>
